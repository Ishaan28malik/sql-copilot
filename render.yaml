# Render Blueprint for the SQL Copilot API (Node web service).
# Create via Render dashboard → New → Blueprint → point at this repo.
# The three secret env vars (sync: false) must be set in the dashboard.
services:
  - type: web
    name: sqlcopilot-api
    runtime: node
    plan: free
    region: singapore
    # Install pnpm via npm (Render's bundled corepack has stale signing keys
    # and fails on `corepack enable`). --prod skips dev-only native builds
    # (wrangler/workerd, vite, sharp) that the Node server doesn't need.
    buildCommand: npm install -g pnpm@11.5.2 && pnpm install --frozen-lockfile --prod
    startCommand: pnpm --filter @sqlcopilot/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: COREPACK_INTEGRITY_KEYS
        value: "0"
      - key: CORS_ORIGIN
        value: https://ishaan28malik.github.io
      - key: HF_CHAT_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: LOG_LEVEL
        value: info
      # Set these in the Render dashboard (Environment tab):
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
