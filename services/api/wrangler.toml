name = "sqlcopilot-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Non-secret defaults; override per environment.
[vars]
OLLAMA_MODEL = "qwen2.5:7b"
OLLAMA_EMBED_MODEL = "bge-small-en-v1.5"
CORS_ORIGIN = "https://ishaan28malik.github.io,http://localhost:5173"
LOG_LEVEL = "info"

# Hyperdrive binding for the app database (Supabase). Preferred over the
# DATABASE_URL secret; see Env.HYPERDRIVE in src/env.ts.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "677418d4577d4347bd0e0ee42ee7e1f3"
localConnectionString = "postgresql://postgres.olkzcmqdxczcwdsztdkg:Newuser%4020261@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=disable"

# Secrets (set with `wrangler secret put <NAME>`):
#   DATABASE_URL    - Supabase Postgres URL (use the transaction pooler, port 6543)
#   ENCRYPTION_KEY  - base64-encoded 32-byte key for AES-256-GCM
#   OLLAMA_URL      - http(s) endpoint of the Ollama VM
#   SQLGLOT_URL     - (optional) SQLGlot validation microservice
