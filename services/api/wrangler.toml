name = "sqlcopilot-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Non-secret defaults; override per environment.
[vars]
OLLAMA_MODEL = "qwen2.5:7b"
OLLAMA_EMBED_MODEL = "bge-small-en-v1.5"
CORS_ORIGIN = "https://ishaan28malik.github.io,http://localhost:5173"
LOG_LEVEL = "info"

# NOTE: The production API now runs on Node (Render), not Workers, because the
# Workers runtime cannot complete a Postgres TLS handshake to arbitrary tenant
# databases. This file is kept only as an optional Workers target for the app's
# own database via Hyperdrive. See README "Architecture" and render.yaml.
#
# To use the Workers target, create a Hyperdrive config and set its id here,
# plus a localConnectionString for `wrangler dev` — never commit a real
# connection string (it contains the DB password). Use .dev.vars locally.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-config-id>"
# localConnectionString = "postgresql://user:password@host:6543/postgres"

# Secrets (set with `wrangler secret put <NAME>` for the Workers target):
#   DATABASE_URL, ENCRYPTION_KEY, HF_TOKEN, OLLAMA_URL, SQLGLOT_URL (optional)
